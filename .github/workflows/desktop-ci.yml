name: JARVIS CI

on:
  push:
    paths:
      - "apps/desktop/**"
      - "packages/**"
      - "services/gateway/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "apps/desktop/**"
      - "packages/**"
      - "services/gateway/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Activate pnpm through Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.22.0 --activate
          pnpm --version
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @jarvis/desktop typecheck
      - run: pnpm --filter @jarvis/desktop build

  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip setuptools wheel
      - run: python -m pip install -e ".[dev]"
      - run: ruff check app tests --output-format=github
      - name: Run gateway tests even when lint reports issues
        if: always()
        run: pytest -q

  native-shell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Activate pnpm through Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.22.0 --activate
          pnpm --version
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Upload generated pnpm lockfile
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-pnpm-lockfile
          path: pnpm-lock.yaml
          if-no-files-found: error
      - name: Build packaged gateway sidecar
        shell: pwsh
        run: .\scripts\build-gateway-sidecar.ps1
      - name: Smoke-test packaged gateway authentication
        shell: pwsh
        run: |
          $token = [Convert]::ToHexString([System.Security.Cryptography.RandomNumberGenerator]::GetBytes(32))
          $env:JARVIS_SESSION_TOKEN = $token
          $dataDirectory = Join-Path $env:RUNNER_TEMP "jarvis-owner-auth-smoke"
          New-Item -ItemType Directory -Force $dataDirectory | Out-Null
          $env:JARVIS_DATA_DIR = $dataDirectory
          $binary = Resolve-Path apps/desktop/src-tauri/binaries/jarvis-gateway-x86_64-pc-windows-msvc.exe
          $process = Start-Process -FilePath $binary -ArgumentList @("--host", "127.0.0.1", "--port", "8765") -PassThru -WindowStyle Hidden
          try {
            $health = $null
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:8765/health" -TimeoutSec 2
                break
              } catch {
                Start-Sleep -Milliseconds 300
              }
            }
            if ($null -eq $health -or $health.service -ne "jarvis-gateway") {
              throw "Packaged gateway did not become healthy"
            }
            $denied = $false
            try {
              Invoke-RestMethod -Uri "http://127.0.0.1:8765/v1/system/capabilities" -TimeoutSec 3 | Out-Null
            } catch {
              if ($_.Exception.Response.StatusCode.value__ -ne 401) { throw }
              $denied = $true
            }
            if (-not $denied) { throw "Protected capabilities endpoint accepted a missing token" }
            $headers = @{ "X-Jarvis-Session" = $token }
            $capabilities = Invoke-RestMethod -Uri "http://127.0.0.1:8765/v1/system/capabilities" -Headers $headers -TimeoutSec 3
            if ($capabilities.security.gateway_session_configured -ne $true) {
              throw "Packaged gateway did not confirm its session configuration"
            }

            $setupPassword = [Convert]::ToBase64String([System.Security.Cryptography.RandomNumberGenerator]::GetBytes(36)) + "Aa7!"
            $setupBody = @{ password = $setupPassword } | ConvertTo-Json -Compress
            $setup = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:8765/v1/auth/setup" -Headers $headers -ContentType "application/json" -Body $setupBody -TimeoutSec 10
            if ([string]::IsNullOrWhiteSpace($setup.owner_session_token)) {
              throw "Packaged owner setup did not return a native session token"
            }

            $ownerHeaders = @{ "X-Jarvis-Session" = $token; "X-Jarvis-Owner-Session" = $setup.owner_session_token }
            $ownerStatus = Invoke-RestMethod -Uri "http://127.0.0.1:8765/v1/auth/status" -Headers $ownerHeaders -TimeoutSec 5
            if ($ownerStatus.authenticated -ne $true -or $ownerStatus.setup_required -ne $false) {
              throw "Packaged owner setup did not authenticate the new account"
            }

            $projectBody = @{ name = "CI Smoke Project"; description = "Packaged owner-scoped persistence test" } | ConvertTo-Json -Compress
            $project = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:8765/v1/projects" -Headers $ownerHeaders -ContentType "application/json" -Body $projectBody -TimeoutSec 5
            if ($project.name -ne "CI Smoke Project") {
              throw "Packaged gateway did not create an owner project"
            }
            $projectList = Invoke-RestMethod -Uri "http://127.0.0.1:8765/v1/projects" -Headers $ownerHeaders -TimeoutSec 5
            if ($projectList.Count -lt 1 -or $projectList[0].id -ne $project.id) {
              throw "Packaged gateway did not persist the owner project"
            }
            $statusBody = @{ status = "paused" } | ConvertTo-Json -Compress
            $updatedProject = Invoke-RestMethod -Method Patch -Uri "http://127.0.0.1:8765/v1/projects/$($project.id)/status" -Headers $ownerHeaders -ContentType "application/json" -Body $statusBody -TimeoutSec 5
            if ($updatedProject.status -ne "paused") {
              throw "Packaged gateway did not update project status"
            }

            $taskBody = @{ title = "CI Smoke Task"; description = "Packaged task persistence test" } | ConvertTo-Json -Compress
            $task = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:8765/v1/projects/$($project.id)/tasks" -Headers $ownerHeaders -ContentType "application/json" -Body $taskBody -TimeoutSec 5
            if ($task.title -ne "CI Smoke Task" -or $task.status -ne "open" -or $task.project_id -ne $project.id) {
              throw "Packaged gateway did not create an owner project task"
            }
            $taskList = Invoke-RestMethod -Uri "http://127.0.0.1:8765/v1/projects/$($project.id)/tasks" -Headers $ownerHeaders -TimeoutSec 5
            if ($taskList.Count -lt 1 -or $taskList[0].id -ne $task.id) {
              throw "Packaged gateway did not persist the project task"
            }
            $taskStatusBody = @{ status = "in_progress" } | ConvertTo-Json -Compress
            $updatedTask = Invoke-RestMethod -Method Patch -Uri "http://127.0.0.1:8765/v1/tasks/$($task.id)/status" -Headers $ownerHeaders -ContentType "application/json" -Body $taskStatusBody -TimeoutSec 5
            if ($updatedTask.status -ne "in_progress") {
              throw "Packaged gateway did not update project task status"
            }
            $decisionBody = @{ title = "CI Smoke Decision"; decision = "Keep the first release local-first."; rationale = "Validate the private workflow before connecting cloud services."; source_ref = "ci://project-decision" } | ConvertTo-Json -Compress
            $decision = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:8765/v1/projects/$($project.id)/decisions" -Headers $ownerHeaders -ContentType "application/json" -Body $decisionBody -TimeoutSec 5
            if ($decision.title -ne "CI Smoke Decision" -or $decision.project_id -ne $project.id) {
              throw "Packaged gateway did not record the project decision"
            }
            $decisionList = Invoke-RestMethod -Uri "http://127.0.0.1:8765/v1/projects/$($project.id)/decisions" -Headers $ownerHeaders -TimeoutSec 5
            if ($decisionList.Count -lt 1 -or $decisionList[0].id -ne $decision.id) {
              throw "Packaged gateway did not persist the project decision"
            }

            $activity = Invoke-RestMethod -Uri "http://127.0.0.1:8765/v1/projects/$($project.id)/activity" -Headers $ownerHeaders -TimeoutSec 5
            $activityTypes = @($activity | ForEach-Object { $_.event_type })
            if ($activityTypes -notcontains "project.created" -or $activityTypes -notcontains "task.created" -or $activityTypes -notcontains "task.status_changed" -or $activityTypes -notcontains "decision.recorded") {
              throw "Packaged gateway did not return the project/task/decision audit trail"
            }

            $milestoneBody = @{ title = "CI Smoke Milestone"; description = "Validate end-to-end milestone tracking."; target_at = 1900000000 } | ConvertTo-Json -Compress
            $milestone = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:8765/v1/projects/$($project.id)/milestones" -Headers $ownerHeaders -ContentType "application/json" -Body $milestoneBody -TimeoutSec 5
            if ($milestone.title -ne "CI Smoke Milestone" -or $milestone.status -ne "planned") {
              throw "Packaged gateway did not create the project milestone"
            }
            $milestoneList = Invoke-RestMethod -Uri "http://127.0.0.1:8765/v1/projects/$($project.id)/milestones" -Headers $ownerHeaders -TimeoutSec 5
            if ($milestoneList.Count -lt 1 -or $milestoneList[0].id -ne $milestone.id) {
              throw "Packaged gateway did not persist the project milestone"
            }
            $milestoneStatusBody = @{ status = "completed" } | ConvertTo-Json -Compress
            $updatedMilestone = Invoke-RestMethod -Method Patch -Uri "http://127.0.0.1:8765/v1/milestones/$($milestone.id)/status" -Headers $ownerHeaders -ContentType "application/json" -Body $milestoneStatusBody -TimeoutSec 5
            if ($updatedMilestone.status -ne "completed" -or $null -eq $updatedMilestone.completed_at) {
              throw "Packaged gateway did not complete the project milestone"
            }
            $milestoneActivity = Invoke-RestMethod -Uri "http://127.0.0.1:8765/v1/projects/$($project.id)/activity" -Headers $ownerHeaders -TimeoutSec 5
            $milestoneEventTypes = @($milestoneActivity | ForEach-Object { $_.event_type })
            if ($milestoneEventTypes -notcontains "milestone.created" -or $milestoneEventTypes -notcontains "milestone.status_changed") {
              throw "Packaged gateway did not include milestones in the project audit trail"
            }

            $loginBody = @{ password = $setupPassword } | ConvertTo-Json -Compress
            $login = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:8765/v1/auth/login" -Headers $headers -ContentType "application/json" -Body $loginBody -TimeoutSec 10
            $loginHeaders = @{ "X-Jarvis-Session" = $token; "X-Jarvis-Owner-Session" = $login.owner_session_token }
            $verifiedCapabilities = Invoke-RestMethod -Uri "http://127.0.0.1:8765/v1/system/capabilities" -Headers $loginHeaders -TimeoutSec 5
            if ($verifiedCapabilities.security.owner_session_authenticated -ne $true) {
              throw "Packaged owner login did not create a valid owner session"
            }

            Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:8765/v1/auth/logout" -Headers $loginHeaders -TimeoutSec 5 | Out-Null
            $afterLogout = Invoke-RestMethod -Uri "http://127.0.0.1:8765/v1/auth/status" -Headers $loginHeaders -TimeoutSec 5
            if ($afterLogout.authenticated -ne $false) {
              throw "Packaged owner logout did not revoke the session"
            }

            Write-Host "Packaged gateway health, transport session, owner setup/login/logout checks passed"
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
            Remove-Item Env:JARVIS_SESSION_TOKEN -ErrorAction SilentlyContinue
            Remove-Item Env:JARVIS_DATA_DIR -ErrorAction SilentlyContinue
            if ($dataDirectory -and (Test-Path $dataDirectory)) {
              Remove-Item -Path $dataDirectory -Recurse -Force
            }
          }
      - name: Build Windows NSIS installer
        run: |
          choco install nsis --no-progress -y
          pnpm --filter @jarvis/desktop tauri:build
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-windows-x64-installer
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

