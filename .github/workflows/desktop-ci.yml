name: JARVIS CI

on:
  push:
    paths:
      - "apps/desktop/**"
      - "packages/**"
      - "services/gateway/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "apps/desktop/**"
      - "packages/**"
      - "services/gateway/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Activate pnpm through Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.22.0 --activate
          pnpm --version
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @jarvis/desktop typecheck
      - run: pnpm --filter @jarvis/desktop build

  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip setuptools wheel
      - run: python -m pip install -e ".[dev]"
      - run: ruff check app tests --output-format=github
      - name: Run gateway tests even when lint reports issues
        if: always()
        run: pytest -q

  native-shell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Activate pnpm through Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.22.0 --activate
          pnpm --version
      - uses: dtolnay/rust-toolchain@stable
      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build desktop frontend
        run: pnpm --filter @jarvis/desktop build
      - name: Compile native Tauri shell
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml

