name: JARVIS Cloud API CI

on:
  pull_request:
    branches: [main]
    paths:
      - "services/cloud-api/**"
      - ".github/workflows/cloud-api.yml"
  push:
    branches: [main, "feature/**"]
    paths:
      - "services/cloud-api/**"
      - ".github/workflows/cloud-api.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloud-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/cloud-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/cloud-api/pyproject.toml
      - name: Install service and test dependencies
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check app tests
      - name: Test
        run: pytest -q
